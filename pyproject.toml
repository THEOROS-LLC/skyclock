[project]
name = "skyclock"
version = "0.1.0"
description = "Sky-clock MCP server: exact time + live sky state for LLM clients, from JPL ephemerides via Skyfield. Working name."
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2", "skyfield>=1.49"]
license = { text = "MIT" }

[project.scripts]
skyclock = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
